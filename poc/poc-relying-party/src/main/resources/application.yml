server:
  port: 8080
spring:
  application:
    name: poc-relying-party
logging:
  level:
    # 특허-A Mode 1 검증 흐름 로그. 단계별 check 까지 보려면 DEBUG 로 변경.
    com.electcerti.krdss: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n"
krdss:
  # 특허-B CA 서버 — 발급용 CA 키스토어(PKCS#12).
  # New-KISA RootCA(자가서명) 가 발급한 "공동인증CA" 키/인증서/체인을 담은 .p12.
  # 비우면 자가서명 데모 CA 로 동작. (데모용 키스토어 — 운영 키는 별도 보관·교체)
  ca:
    keystore: "classpath:pki/joint-ca.p12"
    keystore-password: "changeit"
    key-alias: "joint-ca"
    rp-id: "sol-pc"
  rp:
    # 원격서명 서비스(RSSP/SSA) 진입점
    rssp-base-url: http://localhost:8090
    # 데모 자격증명 식별자(== HSM 키 별칭)
    credential-id: krdss-remote-signer
    # OAuth2 서비스 인증(이용사 클라이언트) — RSSP 설정과 일치해야 함
    oauth:
      client-id: krdss-rp-client
      client-secret: rp-client-secret
    # 서명자 2요소 인증 자격(데모) — SAM 등록값과 일치해야 함
    signer:
      id: signer-001
      pin: "123456"
      totp-secret: "JBSWY3DPEHPK3PXP"
    # 특허-A Mode 1 (WebAuthn 로컬 서명) — SAM/HSM 미경유, RP 내 CA 발급·검증
    #
    # ⚠ rp-id / allowed-origins 는 "브라우저가 실제로 접속하는 주소"와 한 세트다.
    #    rp-id 는 접속 호스트와 같거나 그 상위 도메인이어야 하고(WebAuthn 규칙),
    #    allowed-origins 는 scheme·host·port 가 모두 일치해야 한다.
    #    기본값은 로컬 개발용(http://localhost:8080).
    #    태블릿·QR 시연은 HTTPS 가 필요하므로 demo 프로파일을 사용한다:
    #      ./gradlew :poc:poc-relying-party:bootRun --args='--spring.profiles.active=demo'
    mode1:
      rp-id: localhost
      allowed-origins: "http://localhost:8080"
      user-verification-required: false
      challenge-ttl-seconds: 120
