<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KR-DSS 로컬 PDF 서명·검증 (PDF Baseline)</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--panel2:#334155;--line:#475569;--txt:#e2e8f0;--muted:#94a3b8;--blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,'Malgun Gothic',sans-serif;line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px;}
  header{text-align:center;margin-bottom:22px;}
  header h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.5px;}
  header p{color:var(--muted);margin:6px 0 0;font-size:14px;}
  .badge{display:inline-block;background:var(--panel2);color:var(--muted);font-size:12px;padding:2px 10px;border-radius:999px;margin:8px 4px 0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:19px;color:#93c5fd;}
  .card .desc{color:var(--muted);font-size:13px;margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;}
  label .req{color:var(--red);}
  label .opt{color:var(--muted);font-size:11px;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font-size:14px;font-family:inherit;}
  input[type=file]{padding:8px;}
  input[type=file]::file-selector-button{background:var(--panel2);color:var(--txt);border:none;border-radius:6px;padding:6px 12px;margin-right:10px;cursor:pointer;font-family:inherit;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  button.act{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:var(--blue2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  button.act:hover:not(:disabled){background:var(--blue);}
  button.act:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;}
  button.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  button.ghost:hover{background:var(--line);}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:340px;margin:0;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .result{margin-top:16px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);}
  .result.s{border-color:rgba(34,197,94,.5);} .result.e{border-color:rgba(239,68,68,.5);}
  .indication{display:inline-block;font-weight:800;font-size:17px;padding:6px 14px;border-radius:10px;}
  .TOTAL_PASSED{background:rgba(34,197,94,.15);color:var(--green);}
  .TOTAL_FAILED{background:rgba(239,68,68,.15);color:var(--red);}
  .INDETERMINATE{background:rgba(245,158,11,.15);color:var(--amber);}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin-top:12px;}
  .kv dt{color:var(--muted);} .kv dd{margin:0;word-break:break-all;}
  .sig{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:rgba(15,23,42,.6);}
  .sig h4{margin:0 0 8px;font-size:14px;color:#93c5fd;}
  .msg{font-size:12px;margin:4px 0 0;padding-left:16px;}
  .msg.err{color:var(--red);} .msg.warn{color:var(--amber);} .msg.info{color:var(--muted);}
  .files{font-size:12px;color:var(--muted);}
  .files code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:0 4px 4px 0;display:inline-block;color:var(--txt);}
  .files h4{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
  .ok{color:var(--green);} .bad{color:var(--red);} .ind{color:var(--amber);}
  .hide{display:none;}
  .small{font-size:12px;color:var(--muted);}
  .note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:6px 0 6px 10px;margin-top:12px;}
  details{margin-top:12px;} summary{cursor:pointer;font-size:13px;color:var(--muted);}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>로컬 PDF 서명·검증</h1> 
</header>

<!-- ── 서명 ─────────────────────────────────────────────── -->
<section class="card">
  <h2>① 서명</h2>
  <p class="desc">PDF 에 PAdES-BASELINE-B 서명을 생성한다. 서명값은 업로드한 인증서의 개인키로 만든다.</p>
  <form id="form-sign">
    <label>PDF 파일 <span class="req">*</span></label>
    <input type="file" name="pdf" accept="application/pdf,.pdf" required />

    <div class="grid">
      <div>
        <label>인증서 파일 (PKCS#12) <span class="req">*</span></label>
        <input type="file" name="cert" accept=".p12,.pfx" required />
      </div>
      <div>
        <label>인증서 비밀번호</label>
        <input type="password" name="password" placeholder="예: 111111" autocomplete="off" />
      </div>
    </div>

    <div class="grid">
      <div>
        <label>서명 사유 <span class="opt">(선택 · /Reason)</span></label>
        <input type="text" name="reason" placeholder="예: 계약 동의" />
      </div>
      <div>
        <label>서명 장소 <span class="opt">(선택 · /Location)</span></label>
        <input type="text" name="location" placeholder="예: Seoul, KR" />
      </div>
    </div>

    <button class="act" type="submit" id="btn-sign">PAdES-BASELINE-B 서명</button>
  </form>
  <div id="sign-result" class="result hide"></div>
</section>

<!-- ── 검증 ─────────────────────────────────────────────── -->
<section class="card">
  <h2>② 검증</h2>
  <p class="desc">서명된 PDF 를 트러스트스토어(신뢰 앵커)와 KR-TL(신뢰목록)로 검증하고 리포트를 낸다.</p>
  <form id="form-verify">
    <label>서명된 PDF <span class="req">*</span></label>
    <input type="file" name="pdf" accept="application/pdf,.pdf" required />

    <div class="grid">
      <div>
        <label>트러스트스토어 <span class="req">*</span> <span class="opt">(.p12 / .jks / .crt / .pem)</span></label>
        <input type="file" name="truststore" accept=".p12,.pfx,.jks,.crt,.cer,.pem" required />
      </div>
      <div>
        <label>트러스트스토어 비밀번호 <span class="opt">(PEM/CRT 는 불필요)</span></label>
        <input type="password" name="truststorePassword" autocomplete="off" />
      </div>
    </div>

    <label>KR-TL <span class="opt">(선택 — 없으면 신뢰목록 평가를 생략한다)</span></label>
    <input type="file" name="krtl" accept=".xml,.json,application/xml,text/xml,application/json" />
    <div class="row" style="margin-top:10px;">
      <select id="krtl-format" style="width:auto;">
        <option value="xml">XML — TS 119 612 / XAdES</option>
        <option value="jws">JSON — JWS</option>
      </select>
      <button class="ghost" type="button" id="btn-krtl">서명된 KR-TL 내려받기</button>
      <span class="small">output/certs 의 CA 로 신뢰목록을 만들고 신뢰목록 서명자(kisa-tl-signer)로
        전자서명한 파일을 준다. 받아서 위 입력란에 그대로 올린다.</span>
    </div>

    <button class="act" type="submit" id="btn-verify">검증 수행</button>
  </form>
  <div id="verify-result" class="result hide"></div>

</section>

<p class="small" style="text-align:center;margin:20px 0 8px;">
  KR-DSS Whale PoC · <a href="/" style="color:var(--blue);">홈</a>
  · <a href="/weba-sign.html" style="color:var(--blue);">WebA-Sign 데모</a>
</p>

</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';
const fmtTime = (s) => s ? new Date(s).toLocaleString('ko-KR') : '—';

/** 서버가 400 으로 돌려준 { error } 를 그대로 메시지로 올린다. */
async function fail(res) {
  let detail = res.status + ' ' + res.statusText;
  try {
    const body = await res.json();
    if (body && body.error) detail = body.error;
    else if (body && body.message) detail = body.message;
  } catch (_) { /* JSON 이 아니면 상태줄을 그대로 쓴다 */ }
  throw new Error(detail);
}

function busy(btn, on, label) {
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spin"></span>' + label : label;
}

// ── 서명된 KR-TL 내려받기 ────────────────────────────────────
$('#btn-krtl').addEventListener('click', async () => {
  const format = $('#krtl-format').value;
  const btn = $('#btn-krtl');
  busy(btn, true, '생성 중…');
  try {
    const res = await fetch('/api/pdf/krtl/sample?format=' + format);
    if (!res.ok) await fail(res);
    download(await res.blob(), format === 'xml' ? 'kr-tl-signed.xml' : 'kr-tl-signed.json');
  } catch (e) {
    alert('서명된 KR-TL 생성 실패: ' + e.message);
  } finally {
    busy(btn, false, '서명된 KR-TL 내려받기');
  }
});

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ── 서명 ────────────────────────────────────────────────
let signedBlob = null, signedName = null;

$('#form-sign').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('#btn-sign'), box = $('#sign-result');
  busy(btn, true, '서명 중…');
  box.className = 'result hide';
  try {
    const res = await fetch('/api/pdf/sign', { method: 'POST', body: new FormData(ev.target) });
    if (!res.ok) await fail(res);

    signedBlob = await res.blob();
    signedName = filenameOf(res.headers.get('Content-Disposition')) || 'signed.pdf';

    box.className = 'result s';
    box.innerHTML =
      '<span class="indication TOTAL_PASSED">서명 완료</span>' +
      '<dl class="kv">' +
      '<dt>서명 파일</dt><dd>' + esc(signedName) + ' (' + fmtSize(signedBlob.size) + ')</dd>' +
      '<dt>서명 레벨</dt><dd>' + esc(res.headers.get('X-Krdss-Signature-Level')) + '</dd>' +
      '<dt>서명 알고리즘</dt><dd>' + esc(res.headers.get('X-Krdss-Signature-Algorithm')) + '</dd>' +
      '<dt>서명자</dt><dd>' + esc(res.headers.get('X-Krdss-Signer')) + '</dd>' +
      '</dl>' +
      '<div class="row" style="margin-top:14px;">' +
      '<button class="ghost" id="btn-dl">서명본 내려받기</button>' +
      '<button class="ghost" id="btn-to-verify">아래 검증에 바로 넣기</button>' +
      '</div>';
    $('#btn-dl').addEventListener('click', () => download(signedBlob, signedName));
    $('#btn-to-verify').addEventListener('click', handOffToVerify);
  } catch (e) {
    box.className = 'result e';
    box.innerHTML = '<span class="indication TOTAL_FAILED">서명 실패</span><p class="small" style="margin-top:10px;">' +
      esc(e.message) + '</p>';
  } finally {
    busy(btn, false, 'PAdES-BASELINE-B 서명');
  }
});

function filenameOf(disposition) {
  if (!disposition) return null;
  const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(disposition);
  return m ? decodeURIComponent(m[1]) : null;
}

/** 방금 만든 서명본을 검증 폼의 파일 입력에 그대로 얹는다. */
function handOffToVerify() {
  const input = $('#form-verify input[name=pdf]');
  const transfer = new DataTransfer();
  transfer.items.add(new File([signedBlob], signedName, { type: 'application/pdf' }));
  input.files = transfer.files;
  $('#form-verify').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── 검증 ────────────────────────────────────────────────
$('#form-verify').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('#btn-verify'), box = $('#verify-result');
  busy(btn, true, '검증 중…');
  box.className = 'result hide';
  try {
    const res = await fetch('/api/pdf/verify', { method: 'POST', body: new FormData(ev.target) });
    if (!res.ok) await fail(res);
    renderReport(box, await res.json());
  } catch (e) {
    box.className = 'result e';
    box.innerHTML = '<span class="indication TOTAL_FAILED">검증 실패</span><p class="small" style="margin-top:10px;">' +
      esc(e.message) + '</p>';
  } finally {
    busy(btn, false, '검증 수행');
  }
});

/** KR-TL 배포본 자체의 전자서명 검증 결과를 한 덩어리로 그린다. */
function trustListSignature(sig) {
  if (!sig) return '<span class="ind">평가 정보 없음</span>';
  const mark = (ok, label) =>
    '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✕') + ' ' + label + '</span>';
  const verdict = sig.trustworthy
    ? '<span class="indication TOTAL_PASSED" style="font-size:12px;padding:2px 8px;">신뢰</span>'
    : '<span class="indication INDETERMINATE" style="font-size:12px;padding:2px 8px;">신뢰 불가</span>';
  return verdict +
    (sig.format ? ' <span class="pill">' + esc(sig.format) + '</span>' : '') +
    ' &nbsp; ' + mark(sig.signed, '서명 존재') +
    ' &nbsp; ' + mark(sig.signatureValid, '서명값 유효') +
    ' &nbsp; ' + mark(sig.signerTrusted, '서명자 신뢰') +
    (sig.algorithm ? ' <span class="pill">' + esc(sig.algorithm) + '</span>' : '') +
    (sig.indication
      ? ' <span class="indication ' + esc(sig.indication) + '" style="font-size:11px;padding:1px 7px;">' +
        esc(sig.indication) + (sig.subIndication ? ' / ' + esc(sig.subIndication) : '') + '</span>'
      : '') +
    (sig.signedBy ? '<br>서명자: ' + esc(sig.signedBy) : '') +
    ((sig.signerChain || []).length > 1
      ? '<br><span class="small">경로: ' + sig.signerChain.map(esc).join(' ← ') + '</span>' : '') +
    '<br><span class="small">' + esc(sig.detail) + '</span>';
}

function renderReport(box, r) {
  box.className = 'result ' + (r.status === 'TOTAL_PASSED' ? 's' : r.status === 'TOTAL_FAILED' ? 'e' : '');

  const tl = r.trustList || {};
  const ts = r.trustStore || {};
  const doc = r.document || {};

  const messages = (list, cls, label) => (list && list.length)
    ? list.map((m) => '<p class="msg ' + cls + '">' + label + ' ' + esc(m) + '</p>').join('') : '';

  const signatures = (r.signatures || []).map((s, i) =>
    '<div class="sig">' +
      '<h4>서명 #' + (i + 1) + ' <span class="indication ' + esc(s.indication) + '" style="font-size:12px;padding:2px 8px;">' +
        esc(s.indication) + (s.subIndication ? ' / ' + esc(s.subIndication) : '') + '</span></h4>' +
      '<dl class="kv">' +
      '<dt>서명 포맷</dt><dd>' + esc(s.signatureFormat || '—') + '</dd>' +
      '<dt>서명자</dt><dd>' + esc(s.signedBy || '—') + '</dd>' +
      '<dt>발급기관</dt><dd>' + esc(s.issuer || '—') + '</dd>' +
      '<dt>일련번호</dt><dd>' + esc(s.serialNumber || '—') + '</dd>' +
      '<dt>서명 시각</dt><dd>' + fmtTime(s.signingTime) + '</dd>' +
      '<dt>인증서 경로</dt><dd>' + ((s.certificateChain || []).map(esc).join('<br>') || '—') + '</dd>' +
      '</dl>' +
      messages(s.errors, 'err', '✕') + messages(s.warnings, 'warn', '⚠') + messages(s.infos, 'info', 'ℹ') +
    '</div>').join('');

  box.innerHTML =
    '<span class="indication ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
    '<p class="small" style="margin:10px 0 0;">' + esc(r.summary) + '</p>' +
    '<dl class="kv">' +
    '<dt>검증 시각</dt><dd>' + fmtTime(r.validationTime) + '</dd>' +
    '<dt>대상 문서</dt><dd>' + esc(doc.fileName || '—') + ' (' + fmtSize(doc.size || 0) + ')</dd>' +
    '<dt>신뢰 앵커</dt><dd>' + esc(ts.fileName || '—') + ' — 인증서 ' + (ts.certificateCount || 0) + '건' +
      ((ts.subjects || []).length ? '<br>' + ts.subjects.map(esc).join('<br>') : '') + '</dd>' +
    '<dt>KR-TL</dt><dd>' + (tl.provided
        ? esc(tl.operator || '(운영기관 미기재)') + ' v' + esc(tl.version) +
          ' — 서비스 ' + (tl.serviceCount || 0) + '건' +
          (tl.matched ? '<br>일치: ' + esc(tl.matched) + ' [' + esc(tl.serviceStatus) + ']' : '')
        : '미제출') +
      '<br><span class="small">' + esc(tl.detail) + '</span></dd>' +
    (tl.provided ? '<dt>KR-TL 서명</dt><dd>' + trustListSignature(tl.signature) + '</dd>' : '') +
    '</dl>' +
    signatures +
    (r.etsiSimpleReportXml
      ? '<details><summary>ETSI Simple Report (XML)</summary><pre>' + esc(r.etsiSimpleReportXml) + '</pre></details>'
      : '');
}

</script>
</body>
</html>
